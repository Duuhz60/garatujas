<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset = "UTF-8">
    <title>Hogwarts Legacy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <button class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <img src="hogwarts_logo.png" alt="Logo Hogwarts" class="header-logo">
        <span>Associação Internacional de Hogwarts</span>
        <img src="hogwarts_logo.png" alt="Logo Hogwarts" class="header-logo">
    </header>
    <main>
        <aside></aside>
        <section>
            <form action="get"> 
                <div class="nome">
                    <div class="field">
                        <label for="name">Nome:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="field">
                        <label for="surname">Sobrenome:</label>
                        <input type="text" id="surname" name="surname" required>
                    </div>
                </div>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required><br>

                <label for="birthdate">Data de Nascimento:</label>
                <input type="date" id="birthdate" name="birthdate" required><br>

                <div class="house-selection">
                    <p>Selecione sua Casa:</p>
                    <label class="house-option">
                        <input type="radio" name="house" value="gryffindor" required>
                        <img src="grifinoria.webp" alt="Grifinória" class="house-logo"> Grifinória
                    </label>
                    <label class="house-option">
                        <input type="radio" name="house" value="hufflepuff" required>
                        <img src="lufalufa.webp" alt="Lufa-Lufa" class="house-logo"> Lufa-Lufa
                    </label>
                    <label class="house-option">
                        <input type="radio" name="house" value="ravenclaw" required>
                        <img src="corvinal.webp" alt="Corvinal" class="house-logo"> Corvinal
                    </label>
                    <label class="house-option">
                        <input type="radio" name="house" value="slytherin" required>
                        <img src="sonserina.webp" alt="Sonserina" class="house-logo"> Sonserina
                    </label>
                </div>

                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>
</body>
</html>
